name: weekly-mystery

# Publishes a downloadable "mystery pack" — five new pictures, zipped — as a
# GitHub Release. It is exactly the kind of .zip a player can already drag
# onto the app by hand (README.md's blind-pack drop), so nothing about the
# app itself changes; this just automates building and shipping that zip
# from whatever source photos are queued in puzzles/queue/.
#
# Run by hand from the Actions tab to ship early, or to retry a week whose
# queue came up short.
on:
  schedule: [{ cron: '0 13 * * MON' }]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Only pngjs/jpeg-js are needed to validate the queued images — skip
      # Electron's own postinstall download, which this job never uses.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - id: tag
        run: echo "tag=mystery-$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - run: node tools/pack-weekly-mystery.mjs --tag "${{ steps.tag.outputs.tag }}"

      - name: Commit the consumed queue files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add puzzles/queue
          git commit -m "Weekly mystery pack: ${{ steps.tag.outputs.tag }}"
          # github.event.repository.default_branch is unset on `schedule`
          # triggers — github.ref_name is the branch actually checked out,
          # on every trigger this workflow uses.
          git push origin HEAD:${{ github.ref_name }}

      - name: Publish the pack as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.tag.outputs.tag }}" \
            "dist/${{ steps.tag.outputs.tag }}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Mystery pack — ${{ steps.tag.outputs.tag }}" \
            --notes "5 new mystery pictures. Download the zip and drag it onto paintblob (or drop it on the Pictures list) to add them — each one stays hidden as \"Mystery picture\" until you finish painting it."
