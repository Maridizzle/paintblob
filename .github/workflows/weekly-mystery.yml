name: weekly-mystery

# Bakes five new mystery pictures straight into the app's bundled puzzle
# library (puzzles/*.json + puzzles/manifest.json, blind: true — the same
# way the 4 demo puzzles ship) from whatever source photos are queued in
# puzzles/queue/, then cuts a new app version so they're just *there* the
# next time someone is on that version — no download, no drag-and-drop.
#
# Run by hand from the Actions tab to ship early, or to retry a week whose
# queue came up short.
on:
  schedule: [{ cron: '0 13 * * MON' }]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Only pngjs/jpeg-js are needed to build the queued images — skip
      # Electron's own postinstall download, which this job never uses.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - run: node tools/bake-weekly-mystery.mjs

      # Re-checks geometry on every committed puzzle, these five included —
      # same check ci.yml runs after `npm run seed`.
      - run: npm run verify

      - name: Commit the new pictures and cut a release
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add puzzles
          git commit -m "Weekly mystery pictures: $(date -u +%F)"
          npm version patch
          # github.event.repository.default_branch is unset on `schedule`
          # triggers — github.ref_name is the branch actually checked out,
          # on every trigger this workflow uses. --follow-tags pushes the
          # version-bump commit and its vX.Y.Z tag together; the pushed tag
          # is what triggers release.yml to actually build and publish.
          git push --follow-tags origin HEAD:${{ github.ref_name }}
