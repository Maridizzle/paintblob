name: weekly-mystery

# Bakes five new mystery pictures straight into the app's bundled puzzle
# library (puzzles/*.json + puzzles/manifest.json, blind: true — the same
# way the 4 demo puzzles ship) from whatever source photos are queued in
# puzzles/queue/, so they're just *there* the next time someone is on a
# version that includes them — no download, no drag-and-drop.
#
# This job commits, and stops. Cutting the version is weekly-release.yml's
# job, seven hours later. The gap exists because a picture's cell ids do not
# exist until it has been baked, so its animation tag (see
# docs/animating-pictures.md) can only be chosen afterwards — and if the
# release went out with this commit, every picture would arrive lifeless and
# only come alive a week later.
#
# Run by hand from the Actions tab to ship early, or to retry a week whose
# queue came up short.
on:
  schedule: [{ cron: '0 13 * * MON' }]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Only pngjs/jpeg-js are needed to build the queued images — skip
      # Electron's own postinstall download, which this job never uses.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - run: node tools/bake-weekly-mystery.mjs

      # Re-checks geometry on every committed puzzle, these five included —
      # same check ci.yml runs after `npm run seed`.
      - run: npm run verify

      - name: Commit the new pictures
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add puzzles
          git commit -m "Weekly mystery pictures: $(date -u +%F)"
          # No version bump and no tag here — weekly-release.yml cuts those
          # once there has been time to animate the new pictures.
          # github.event.repository.default_branch is unset on `schedule`
          # triggers; github.ref_name is the branch actually checked out, on
          # every trigger this workflow uses.
          git push origin HEAD:${{ github.ref_name }}
