name: release

# Push a tag to cut a release:
#   npm version patch && git push --follow-tags
# Or run this workflow by hand from the Actions tab to get installers as
# artifacts without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: 'dist:linux'
          - os: macos-latest
            script: 'dist:mac'
          - os: windows-latest
            script: 'dist:win'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Package
        run: npm run ${{ matrix.script }}
        env:
          # There are no signing certificates in this repo. Without this,
          # electron-builder hunts for a keychain identity on macOS and fails
          # the build rather than producing an unsigned app.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        with:
          name: paintblob-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.dmg
            dist/*.zip
            dist/*.exe

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cat > notes.md <<'NOTES'
          Builds are unsigned, so the first launch needs a nudge:

          - **macOS** — right-click the app and choose Open, then Open again.
          - **Windows** — SmartScreen shows "More info" then "Run anyway".
          - **Linux** — the AppImage wants libfuse2 on newer distributions.
            Install it, or run with `APPIMAGE_EXTRACT_AND_RUN=1`.
          NOTES

          find artifacts -type f -print
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "paintblob $GITHUB_REF_NAME" \
            --notes-file notes.md \
            $(find artifacts -type f | sort)
