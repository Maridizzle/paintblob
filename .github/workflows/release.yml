name: release

# Push a tag to cut a release:
#   npm version patch && git push --follow-tags
# Or run this workflow by hand from the Actions tab to get installers as
# artifacts without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: 'dist:linux'
          - os: macos-latest
            script: 'dist:mac'
          - os: windows-latest
            script: 'dist:win'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Package
        run: npm run ${{ matrix.script }}
        env:
          # There are no signing certificates in this repo. Without this,
          # electron-builder hunts for a keychain identity on macOS and fails
          # the build rather than producing an unsigned app.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        with:
          name: paintblob-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.dmg
            dist/*.zip
            dist/*.exe

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach installers to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Tag pushes name themselves. A manual run takes its version from
          # package.json and lets gh create the tag, so a release can still be
          # cut from environments where pushing tags is not permitted.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="v$(node -p "require('./package.json').version")"
          else
            TAG="$GITHUB_REF_NAME"
          fi

          cat > notes.md <<'NOTES'
          Download the one for your computer, then open it like any other app.

          - **macOS** — `.dmg` (`arm64` for Apple Silicon, `x64` for Intel)
          - **Windows** — `.exe`
          - **Linux** — `.AppImage`

          These are unsigned, so the first launch needs a nudge: on macOS
          right-click the app and choose Open, then Open again. On Windows,
          SmartScreen shows "More info" then "Run anyway". The Linux AppImage
          wants libfuse2 on newer distributions — install it, or run with
          `APPIMAGE_EXTRACT_AND_RUN=1`.
          NOTES

          # An array, not a bare string. Installer filenames have contained
          # spaces ("paintblob Setup 0.2.0.exe"), and unquoted word splitting
          # turns one of those into two nonexistent paths.
          mapfile -t FILES < <(find artifacts -type f | sort)
          printf '  %s\n' "${FILES[@]}"
          [ "${#FILES[@]}" -gt 0 ] || { echo "no artifacts to publish"; exit 1; }

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${FILES[@]}"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "paintblob $TAG" \
              --notes-file notes.md \
              "${FILES[@]}"
          fi
