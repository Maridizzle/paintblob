<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover lets the card reach under a notch; the safe-area
       insets in the stylesheet keep content clear of it. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#17151f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- connect-src covers fetching bundled puzzles when served over http;
       Electron uses IPC and never needs it. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'" />
  <title>paintblob</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="bar">
      <span class="dot" id="barDot"></span>
      <span class="title">paintblob</span>
      <span class="subtitle" id="barSubtitle"></span>
      <span class="spacer"></span>
      <button class="icon" data-act="pictures" title="Pictures — add your own">▦</button>
      <button class="icon" data-act="trophies" title="Achievements">★</button>
      <button class="icon" data-act="settings" title="Settings">⚙</button>
      <button class="icon desktop-only" data-act="pin" title="Always on top">◉</button>
      <button class="icon desktop-only" data-act="minimise" title="Minimise">–</button>
      <button class="icon danger desktop-only" data-act="close" title="Close">✕</button>
    </header>

    <div id="stage">
      <canvas id="board"></canvas>

      <div id="finish" class="finish hidden">
        <div class="finish-card">
          <div class="finish-title">Finished</div>
          <div class="finish-name" id="finishName"></div>
          <div class="finish-stats" id="finishStats"></div>
          <button class="primary" data-act="next">Next picture</button>
        </div>
      </div>

      <div id="toasts"></div>
    </div>

    <div id="drop" class="drop-hint"><span>Drop to add a picture</span></div>

    <footer id="tray">
      <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
      <div id="tubs" class="tubs"></div>
    </footer>

    <div id="grip" class="desktop-only" title="Resize"></div>

    <section id="panel" class="panel hidden">
      <header class="panel-bar">
        <span id="panelTitle">Pictures</span>
        <button class="icon" data-act="panel-close">✕</button>
      </header>
      <div id="panelBody" class="panel-body"></div>
    </section>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
