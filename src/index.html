<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- viewport-fit=cover lets the card reach under a notch; the safe-area
       insets in the stylesheet keep content clear of it. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#121216" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- connect-src covers fetching bundled puzzles when served over http;
       Electron uses IPC and never needs it. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'" />
  <title>paintblob</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="bar">
      <span class="dot" id="barDot"></span>
      <span class="title">paintblob</span>
      <span class="subtitle" id="barSubtitle"></span>
      <span class="spacer"></span>
      <!-- A stamped catalogue mark filling the wide title bar on desktop; hidden
           on web/touch where the bar is tight and there is no dead space. -->
      <span class="bar-seal desktop-only" aria-hidden="true">№&nbsp;07</span>
      <button class="icon" data-act="pictures" title="Pictures — add your own">▦</button>
      <button class="icon hint-btn empty" data-act="hint" title="Use a hint — flashes and enlarges a cell for a minute">✦<span class="badge">0</span></button>
      <button class="icon" data-act="trophies" title="Achievements">★</button>
      <!-- Always-visible way to swap between Story and Free mode (with a
           confirm). Free mode had no in-app door back into the story before. -->
      <button class="icon" data-act="mode-swap" title="Switch between Story and Free mode">⇄</button>
      <button class="icon" data-act="settings" title="Settings">⚙</button>
      <button class="icon desktop-only" data-act="pin" title="Always on top">◉</button>
      <button class="icon desktop-only" data-act="minimise" title="Minimise">–</button>
      <button class="icon danger desktop-only" data-act="close" title="Close">✕</button>
    </header>

    <div id="stage">
      <canvas id="board"></canvas>

      <button id="zoomPill" class="zoom-pill hidden" data-act="zoom-reset" title="Reset zoom">100%</button>
      <button id="undoPill" class="undo-pill hidden" data-act="undo"
        title="Undo the last cell (Ctrl/Cmd+Z)">↶ Undo</button>
      <button id="comparePill" class="compare-pill hidden" data-act="toggle-source"
        title="Compare against the original picture"></button>

      <div id="pointsHud" class="points-hud" title="Points">
        <span class="points-hud-icon">🪙</span>
        <span id="pointsValue" class="points-hud-value">0</span>
        <div id="pointsFx" class="points-fx"></div>
      </div>

      <div id="finish" class="finish hidden">
        <div class="finish-card">
          <button class="icon finish-close" data-act="finish-dismiss" title="Keep looking at it">✕</button>
          <div class="finish-title">Finished</div>
          <div class="finish-name" id="finishName"></div>
          <div class="finish-stats" id="finishStats"></div>
          <button class="primary" data-act="next">Next picture</button>
        </div>
      </div>

      <!-- The Story ⇄ Free confirm, reusing the finish card's modal styling.
           Its title/body/button text are set by showModeSwap() from the current
           mode; the primary switches, the ✕ stays put. -->
      <div id="modeSwap" class="finish hidden">
        <div class="finish-card">
          <button class="icon finish-close" data-act="mode-cancel" title="Stay here">✕</button>
          <div class="finish-title" id="modeSwapTitle"></div>
          <div class="finish-name" id="modeSwapBody"></div>
          <button class="primary" data-act="mode-go">Switch</button>
        </div>
      </div>

      <!-- Overtime: the picture squinted down to thirty blocks of one hue for
           sixty seconds. Offered by a chip you can ignore — it never takes the
           canvas without being asked. -->
      <button id="overtimeChip" class="ot-chip hidden" data-act="overtime">
        <span class="ot-chip-mark">◑</span>
        <span class="ot-chip-text">Overtime<i>60s · win a doubled brush</i></span>
      </button>
      <div id="overtime" class="overtime hidden"></div>

      <!-- The Swap: story mode's bonus. Give six colours back their names before
           the clock runs out and they answer to you again. -->
      <button id="swapChip" class="ot-chip swap-chip hidden" data-act="swap">
        <span class="ot-chip-mark">✦</span>
        <span class="ot-chip-text">The Swap<i>give the colours their names back</i></span>
      </button>
      <div id="swap" class="overtime swap-overlay hidden"></div>
      <!-- Named counter: shows while the Swap's boon is being spent. -->
      <div id="namedPill" class="named-pill hidden"></div>

      <!-- Shown only while a story stone is being painted: the way back to the
           path without leaving story mode. Mirrors the undo pill. -->
      <button id="storyPill" class="story-pill hidden" data-act="story-board"
        title="Back to the path">↩ The path</button>

      <!-- Developer mode only: fills the whole picture at once, so a stone can be
           cleared and the next one (or a boss's reward) checked without painting
           it. Hidden unless dev mode is on and an unfinished picture is loaded. -->
      <button id="devPill" class="dev-pill hidden" data-act="dev-complete"
        title="Instantly complete this picture">🛠 Complete</button>

      <!-- The boss health bar: X's grip on the last stone. It drains as you
           paint and ticks back up whenever X takes cells, so the tug-of-war is
           legible. The fill width and the status line are set from game.js;
           shown only while a boss stone is loaded and unfinished. -->
      <div id="bossHud" class="boss-hud hidden">
        <div class="boss-hud-top">
          <span class="boss-hud-mark">✕</span>
          <span class="boss-hud-name">The Wrong-Colour Day</span>
          <span class="boss-status"></span>
        </div>
        <div class="boss-health"><i class="boss-health-fill"></i></div>
      </div>

      <div id="toasts"></div>
    </div>

    <div id="drop" class="drop-hint"><span>Drop to add a picture</span></div>

    <footer id="tray">
      <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
      <!-- The avatar lives down here with the tubs rather than over the picture.
           Its abilities used to be a column of up to eight buttons standing on
           the canvas, worst for the player who had unlocked the most; they are
           a pop-up now, and only while it is open does anything cover the art.
           Inside #tubs and not a rail beside it: a sibling takes its width off
           every line and costs a wrap row on every picture, where riding in the
           flow only costs one when the last line is already full. -->
      <div id="tubs" class="tubs">
        <div id="avatarWidget" class="avatar-widget">
          <div id="abilityRow" class="ability-row hidden"></div>
          <!-- The ring is the XP bar: a lap of the circle rather than a stick
               under it, so the resting state is one clean shape. -->
          <div class="avatar-ring" id="avatarRing">
            <button id="avatarPill" class="avatar-pill" data-act="avatar-toggle"
              title="Your avatar and abilities" aria-expanded="false"
              aria-haspopup="true" aria-controls="abilityRow"></button>
          </div>
        </div>
      </div>
    </footer>

    <div id="grip" class="desktop-only" title="Resize"></div>

    <section id="panel" class="panel hidden">
      <header class="panel-bar">
        <span id="panelTitle">Pictures</span>
        <button class="icon" data-act="panel-close">✕</button>
      </header>
      <div id="panelBody" class="panel-body"></div>
      <!-- The big look at an unpainted picture. Inside the panel so it covers
           the list and nothing else, and so closing the panel takes it too. -->
      <div id="picPreview" class="pic-preview hidden"></div>
    </section>

    <!-- The login menu: Free mode or Story mode. Its buttons are built in JS so
         Continue can appear only for a returning player. -->
    <section id="title" class="title-screen hidden">
      <div class="title-card">
        <div class="title-mark">paintblob</div>
        <div class="title-tag" id="titleTag"></div>
        <div class="title-actions" id="titleActions"></div>
      </div>
    </section>

    <!-- The chapter board: a stepping-stone path across the Sampler. The path
         and its stones are drawn into #storyPath by renderStoryBoard(). -->
    <section id="storyBoard" class="story-board hidden">
      <header class="story-bar">
        <button class="icon" data-act="story-back" title="Back to the menu">‹</button>
        <span class="story-chapter" id="storyChapter"></span>
        <span class="spacer"></span>
        <!-- The story board covers the top bar, so its ⚙ is unreachable here;
             this one opens the same Settings panel (theme, sound, …) so a
             player can switch to dark mode without leaving the story. -->
        <button class="icon" data-act="settings" title="Settings">⚙</button>
        <button class="icon" data-act="story-free" title="Free mode">▦</button>
      </header>
      <div class="story-scroll">
        <div class="story-path" id="storyPath"></div>
      </div>
    </section>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
